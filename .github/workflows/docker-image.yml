name: Omeka-S Docker Image CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  # weekly rebuild to pick up PHP patch releases and OS security updates from the webdevops base image
  schedule:
    - cron: '0 4 * * 1'

jobs:
  build-and-push-docker-image:
    runs-on: ubuntu-latest
    name: pushing job to Docker Hub
    # set all the versions of php and omeka-s we will build an image of to push on docker hub
    strategy:
      matrix:
        # explicit omeka-s / php combinations to build
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategymatrixinclude
        include:
          - omeka-s-version: "4.0.4"
            php-version: "8.2"
          - omeka-s-version: "4.1.0"
            php-version: "8.2"
          - omeka-s-version: "4.1.0"
            php-version: "8.3"
          - omeka-s-version: "4.1.1"
            php-version: "8.2"
          - omeka-s-version: "4.1.1"
            php-version: "8.3"
          - omeka-s-version: "4.2.0"
            php-version: "8.2"
          - omeka-s-version: "4.2.0"
            php-version: "8.3"
          - omeka-s-version: "4.2.0"
            php-version: "8.4"
          - omeka-s-version: "4.2.1"
            php-version: "8.2"
          - omeka-s-version: "4.2.1"
            php-version: "8.3"
          - omeka-s-version: "4.2.1"
            php-version: "8.4"
          - omeka-s-version: "4.2.1"
            php-version: "8.5"
        
    steps:
        # for access to repository (given to workflow)
      - name: Checkout repository
        uses: actions/checkout@v4
      
      -  name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}
        
        # Docker builder needed to be able to build the images
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # builds and pushes the images for each version specified in matrix
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          push: true
          # always pull the latest base image and never reuse cached layers
          pull: true
          no-cache: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/omeka-s-docker:${{ matrix.omeka-s-version }}-php-${{ matrix.php-version }}
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            OMEKA_S_VERSION=${{ matrix.omeka-s-version }}
