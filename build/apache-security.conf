# Security rules for Omeka S: the Omeka .htaccess serves every existing file directly.
# config, files, logs, modules and themes in /var/www/omeka-s are symlinks to /volume, both paths are matched.

# Hidden files and folders (.git, .env, ...), except .well-known
<DirectoryMatch "/\.(?!well-known/)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.(?!well-known$)">
    Require all denied
</FilesMatch>

# Configuration, logs, Composer packages and application code (except its assets)
<DirectoryMatch "^/(var/www/omeka-s|volume)/(config|logs)/">
    Require all denied
</DirectoryMatch>
<DirectoryMatch "^/var/www/omeka-s/(vendor/|application/(?!asset/))">
    Require all denied
</DirectoryMatch>

# Documentation, package manifests, logs and dumps (version fingerprinting), outside uploaded files
<DirectoryMatch "^/(var/www/omeka-s|volume)/(?!files/)">
    <FilesMatch "(?i)^(readme|changelog|changes|license|licence|copying|upgrad(e|ing)|contributing|security)(\..*)?$|\.(md|dist|log|sql|sh|lock)$|^(composer|package|package-lock)\.json$|^gulpfile\.js$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# PHP: only /index.php may be requested (also blocks PHP in uploaded files)
<FilesMatch "(?i)\.(php\d?|phtml|phps|phar|hphp)$">
    Require all denied
</FilesMatch>
<Location "/index.php">
    Require all granted
</Location>
